[project]
name = "sparcc"
version = "2026.0.0"
description = "SparCC: correlations in compositional data (16S/metagenomics), with Dask + Numba"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Daniel Legorreta", email = "d.legorreta.anguiano@gmail.com" },
]
dependencies = [
    "numpy",
    "pandas",
    "dask[dataframe]",
    "numba",
    "scipy",
    "h5py",
    "pyyaml",
    "typer",
    "wasabi",
    "psutil",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the root-level scripts (MakeBootstraps.py, PseudoPvals.py, ...) importable in tests.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The code base uses %-formatting throughout; leave it alone.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# Long optparse usage/help strings.
"MakeBootstraps.py" = ["E501"]
"PseudoPvals.py" = ["E501"]

[tool.mypy]
# pandas, h5py and psutil ship without type stubs.
ignore_missing_imports = true
